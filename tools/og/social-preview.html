<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<!-- Source for img/og-image.png (the link preview card). Fixed 1200x630.
     Re-render with:  node tools/og/render.mjs   (or see that file for the Chrome command) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: flex; align-items: center;
    font-family: "Inter", -apple-system, sans-serif;
    background: #f6f8f7;
    position: relative;
  }
  /* soft brand glow behind the vials */
  .glow-wash {
    position: absolute; right: -140px; top: 50%; transform: translateY(-50%);
    width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(106,188,171,.30) 0%, rgba(106,188,171,.12) 45%, rgba(246,248,247,0) 70%);
  }
  .rule { position: absolute; left: 0; top: 0; width: 100%; height: 8px;
          background: linear-gradient(90deg, #0e8f7e 0%, #6ABCAB 55%, #e5386a 100%); }

  .left { position: relative; width: 672px; padding: 0 0 0 76px; display: flex; flex-direction: column; gap: 22px; }
  .logo { width: 316px; height: auto; }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600;
    font-size: 112px; line-height: .96; letter-spacing: -.025em; color: #0f1c26;
  }
  h1 em { font-style: italic; font-weight: 500; color: #0e8f7e; }
  .lead { font-size: 29px; line-height: 1.34; color: #33434f; max-width: 17.5em; font-weight: 400; }
  .chips { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    font-size: 17px; font-weight: 600; color: #0a6c5f; background: #d9f1ec;
    padding: 9px 16px; border-radius: 999px; white-space: nowrap;
  }
  .domain {
    margin-top: 6px; display: flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 600; letter-spacing: .04em; color: #0f1c26;
  }
  .domain::before { content: ""; width: 34px; height: 3px; border-radius: 2px; background: #0e8f7e; }

  .right { position: relative; flex: 1; height: 100%; }
  .vials { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 0; }
  .vials img {
    width: 224px; height: auto; display: block;
    border-radius: 18px; border: 1px solid rgba(15,28,38,.06);
    box-shadow: 0 26px 48px rgba(15,28,38,.20);
  }
  .vials img:nth-child(1) { transform: translate(44px, -30px) rotate(-6deg) scale(.88); z-index: 1; }
  .vials img:nth-child(2) { transform: translateY(20px) scale(1.04); z-index: 3; }
  .vials img:nth-child(3) { transform: translate(-44px, -30px) rotate(6deg) scale(.88); z-index: 2; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="glow-wash"></div>

  <div class="left">
    <img class="logo" src="../../site/img/glow-logo.png" alt="Glow Peptides" />
    <h1>Bienvenidos<em>.</em></h1>
    <p class="lead">Péptidos de pureza verificada por laboratorio en USA — ahora en Guatemala.</p>
    <div class="chips">
      <span class="chip">Pureza ≥99%</span>
      <span class="chip">Certificado por lote</span>
      <span class="chip">Entrega local</span>
    </div>
    <div class="domain">glowguate.com</div>
  </div>

  <div class="right">
    <div class="vials">
      <img src="../../site/img/glow.jpg" alt="" />
      <img src="../../site/img/retatrutide.jpg" alt="" />
      <img src="../../site/img/nad.jpg" alt="" />
    </div>
  </div>
</body>
</html>
