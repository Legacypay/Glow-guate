<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Methylene Blue" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%"  stop-color="#f1f5f9" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- vial body -->
  <rect x="130" y="95" width="140" height="330" rx="18" fill="url(#glass)" stroke="#94a3b8" stroke-width="2"/>
  <!-- neck + cap -->
  <rect x="152" y="62" width="96" height="42" rx="8" fill="url(#g)"/>
  <rect x="146" y="52" width="108" height="20" rx="8" fill="#1d4ed8"/>
  <!-- label -->
  <rect x="140" y="190" width="120" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="140" y="190" width="120" height="10" rx="5" fill="#1d4ed8"/>
  <text x="200" y="228" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#0f172a">Methylene Blue</text>
  <text x="200" y="250" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">15 mg · 60 caps</text>
  <text x="200" y="300" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.6">RESEARCH USE ONLY</text>
  <text x="200" y="316" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="8" fill="#cbd5e1" letter-spacing="0.5">IMAGE PENDING</text>
</svg>