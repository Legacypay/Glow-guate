<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Glow Peptides GT</title>
  <link rel="icon" type="image/png" href="../img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin">

<!-- login ------------------------------------------------------------- -->
<div id="login" class="login-wrap">
  <form class="login-card" id="loginForm">
    <img src="../img/glow-logo.png" alt="Glow Peptides" width="200" />
    <h1>Centro de administración</h1>
    <p class="muted">Glow Peptides GT</p>
    <div class="field">
      <label for="pw">Contraseña</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus required />
    </div>
    <p class="form-error" id="loginError" hidden></p>
    <button type="submit" class="btn btn-teal btn-block" id="loginBtn">Entrar</button>
  </form>
</div>

<!-- app --------------------------------------------------------------- -->
<div id="app" hidden>
  <header class="admin-head">
    <div class="wrap">
      <a class="brand" href="../"><img src="../img/burst.svg" alt="" width="30" height="30" /><span>Glow Peptides <span class="gt">GT</span></span></a>
      <nav class="admin-tabs" id="tabs">
        <button type="button" data-tab="resumen" aria-current="page">Resumen</button>
        <button type="button" data-tab="pedidos">Pedidos <span class="pill" id="tabOrders"></span></button>
        <button type="button" data-tab="inventario">Inventario <span class="pill warn" id="tabLow"></span></button>
      </nav>
      <div class="admin-actions">
        <button type="button" class="btn btn-outline btn-sm" id="refresh">Actualizar</button>
        <button type="button" class="btn btn-ghost btn-sm" id="logout">Salir</button>
      </div>
    </div>
  </header>

  <main class="wrap admin-main">
    <!-- dashboard -->
    <section data-panel="resumen">
      <div class="stat-grid" id="stats"></div>
      <div class="two-col">
        <div class="panel">
          <div class="panel-head"><h2>Pedidos recientes</h2><button type="button" class="btn btn-ghost btn-sm" data-goto="pedidos">Ver todos</button></div>
          <div id="recentOrders"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Stock bajo</h2><button type="button" class="btn btn-ghost btn-sm" data-goto="inventario">Ver inventario</button></div>
          <div id="lowStock"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Más vendidos</h2></div>
        <div id="topProducts"></div>
      </div>
    </section>

    <!-- orders -->
    <section data-panel="pedidos" hidden>
      <div class="toolbar">
        <div class="chips" id="statusChips"></div>
        <input type="search" id="orderSearch" class="lib-search" placeholder="Buscar por pedido, nombre, teléfono…" />
        <button type="button" class="btn btn-outline btn-sm" id="exportCsv">Exportar CSV</button>
      </div>
      <div id="ordersList"></div>
    </section>

    <!-- inventory -->
    <section data-panel="inventario" hidden>
      <div class="toolbar">
        <div class="low-setting">
          <label for="lowAt">Avisar cuando el stock sea ≤</label>
          <input type="number" id="lowAt" min="0" max="999" />
        </div>
        <span class="muted" id="invNote"></span>
      </div>
      <div id="inventoryList"></div>
    </section>
  </main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-panel" id="modalPanel"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../data.js"></script>
<script src="admin.js"></script>
</body>
</html>
